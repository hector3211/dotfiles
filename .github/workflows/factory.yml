name: Factory checks
on:
  push:
    paths:
      - 'agents/.agents/factory/**'
      - 'pi/.pi/agent/extensions/factory.ts'
      - '.github/workflows/factory.yml'
  pull_request:
    paths:
      - 'agents/.agents/factory/**'
      - 'pi/.pi/agent/extensions/factory.ts'
      - '.github/workflows/factory.yml'
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
        working-directory: agents/.agents/factory
      - run: npm run typecheck
        working-directory: agents/.agents/factory
      - run: npm test
        working-directory: agents/.agents/factory
